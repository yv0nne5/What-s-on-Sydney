<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What's on Sydney</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #FFDE59;
      color: #0a0a0a;
      min-height: 100vh;
    }

    /* ── HERO ── */
    .hero {
      background: #0a0a0a;
      padding: 2rem 1.5rem 1.5rem;
      border-bottom: 3px solid #0a0a0a;
    }
    .hero-eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #FFDE59;
      margin-bottom: 10px;
    }
    .hero-title {
      font-size: 36px;
      font-weight: 700;
      color: #fff;
      line-height: 1.1;
    }
    .hero-title span { color: #FFDE59; }
    .hero-sub {
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      margin-top: 10px;
      letter-spacing: 0.03em;
    }
    #live-count { color: #FFDE59; font-weight: 600; }

    /* ── FILTERS ── */
    .filters {
      background: #fff;
      border-bottom: 3px solid #0a0a0a;
      padding: 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .filter-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }
    .flabel {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #999;
      min-width: 52px;
    }
    .pill {
      font-size: 12px;
      font-weight: 600;
      padding: 5px 13px;
      border: 2px solid #0a0a0a;
      background: #fff;
      color: #0a0a0a;
      cursor: pointer;
      border-radius: 0;
      box-shadow: 2px 2px 0 #0a0a0a;
      transition: transform 0.08s, box-shadow 0.08s;
      user-select: none;
    }
    .pill:hover { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #0a0a0a; }
    .pill.active { background: #0a0a0a; color: #FFDE59; }
    .pill[data-value="free"].active   { background: #00C896; color: #fff; border-color: #00C896; box-shadow: 2px 2px 0 #0a0a0a; }
    .pill[data-value="festival"].active { background: #FF4D6D; color: #fff; border-color: #FF4D6D; box-shadow: 2px 2px 0 #0a0a0a; }
    .pill[data-value="market"].active   { background: #FF9F1C; color: #0a0a0a; border-color: #FF9F1C; box-shadow: 2px 2px 0 #0a0a0a; }
    .pill[data-value="art"].active      { background: #7B2FBE; color: #fff; border-color: #7B2FBE; box-shadow: 2px 2px 0 #0a0a0a; }
    .pill[data-value="outdoor"].active  { background: #2DC653; color: #fff; border-color: #2DC653; box-shadow: 2px 2px 0 #0a0a0a; }
    .pill[data-value="community"].active { background: #00C896; color: #fff; border-color: #00C896; box-shadow: 2px 2px 0 #0a0a0a; }

    /* ── CARDS ── */
    .cards {
      padding: 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 18px;
      background: #FFDE59;
    }
    .card {
      background: #fff;
      border: 3px solid #0a0a0a;
      box-shadow: 5px 5px 0 #0a0a0a;
      display: flex;
      flex-direction: column;
    }
    .card[hidden] { display: none !important; }

    /* card header colours */
    .card-hdr {
      padding: 0.6rem 1rem;
      border-bottom: 3px solid #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .hdr-festival  { background: #FF4D6D; }
    .hdr-market    { background: #FF9F1C; }
    .hdr-art       { background: #7B2FBE; }
    .hdr-outdoor   { background: #2DC653; }
    .hdr-food      { background: #FF6B35; }
    .hdr-community { background: #00C896; }
    .hdr-other     { background: #888; }

    .card-cat-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #0a0a0a;
    }
    .hdr-art .card-cat-label,
    .hdr-other .card-cat-label { color: #fff; }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border: 2px solid #0a0a0a;
    }
    .badge-free { background: #FFDE59; color: #0a0a0a; }
    .badge-paid { background: #fff;    color: #0a0a0a; }

    .card-body {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.4;
      color: #0a0a0a;
    }
    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .meta-item {
      font-size: 12px;
      color: #555;
    }
    .card-desc {
      font-size: 13px;
      color: #444;
      line-height: 1.65;
      border-left: 3px solid #0a0a0a;
      padding-left: 10px;
      flex: 1;
    }

    .card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0.75rem 1rem;
      border-top: 3px solid #0a0a0a;
      background: #FFFDE0;
    }
    .tags { display: flex; gap: 5px; flex-wrap: wrap; }
    .tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 8px;
      border: 2px solid #0a0a0a;
      background: #fff;
      color: #0a0a0a;
    }

    .add-btn {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 7px 14px;
      border: 2px solid #0a0a0a;
      background: #FFDE59;
      color: #0a0a0a;
      cursor: pointer;
      box-shadow: 3px 3px 0 #0a0a0a;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: transform 0.08s, box-shadow 0.08s;
      white-space: nowrap;
    }
    .add-btn:hover { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #0a0a0a; }

    /* ── EMPTY STATE ── */
    .empty {
      display: none;
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      border: 3px dashed #0a0a0a;
      font-size: 15px;
      font-weight: 600;
      color: #555;
    }

    /* ── FOOTER ── */
    .footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 12px;
      color: #555;
      border-top: 3px solid #0a0a0a;
      background: #0a0a0a;
      color: rgba(255,255,255,0.4);
    }
    .footer a { color: #FFDE59; text-decoration: none; }

    @media (max-width: 500px) {
      .hero-title { font-size: 28px; }
      .cards { padding: 1rem; gap: 14px; }
    }
  </style>
</head>
<body>

<header class="hero">
  <p class="hero-eyebrow">Sydney &amp; surrounds · Auto-updated weekly</p>
  <h1 class="hero-title">What's on <span>Sydney</span></h1>
  <p class="hero-sub"><span id="live-count">0</span> things to do · Updated 16 Aug 2026</p>
</header>

<div class="filters">
  <div class="filter-row">
    <span class="flabel">Vibe</span>
    <button class="pill active" data-filter="cat" data-value="all">All</button>
    <button class="pill" data-filter="cat" data-value="free">Free only</button>
    <button class="pill" data-filter="cat" data-value="festival">Festivals</button>
    <button class="pill" data-filter="cat" data-value="market">Markets</button>
    <button class="pill" data-filter="cat" data-value="art">Art</button>
    <button class="pill" data-filter="cat" data-value="outdoor">Outdoor</button>
    <button class="pill" data-filter="cat" data-value="community">Community</button>
  </div>
  <div class="filter-row">
    <span class="flabel">Where</span>
    <button class="pill active" data-filter="region" data-value="all">Everywhere</button>
    <button class="pill" data-filter="region" data-value="sydney">Sydney</button>
    <button class="pill" data-filter="region" data-value="blue_mountains">Blue Mountains</button>
    <button class="pill" data-filter="region" data-value="southern_highlands">S. Highlands</button>
    <button class="pill" data-filter="region" data-value="hunter_valley">Hunter Valley</button>
    <button class="pill" data-filter="region" data-value="illawarra">Illawarra</button>
  </div>
</div>

<main class="cards" id="cards">

  <p class="empty" id="empty-msg">No events match these filters — try broadening your search.</p>
</main>

<footer class="footer">
  What's on Sydney · Auto-updated every Monday via GitHub Actions ·
  <a href="https://www.timeout.com/sydney" target="_blank">Time Out</a> ·
  <a href="https://www.theurbanlist.com/sydney" target="_blank">Urban List</a> ·
  <a href="https://www.nationalparks.nsw.gov.au" target="_blank">National Parks NSW</a>
</footer>

<script>
  const cards = Array.from(document.querySelectorAll('.card'));
  const emptyMsg = document.getElementById('empty-msg');
  const liveCount = document.getElementById('live-count');

  let activeCat = 'all';
  let activeRegion = 'all';

  function applyFilters() {
    let visible = 0;
    cards.forEach(card => {
      const cat = card.dataset.cat;
      const region = card.dataset.region;
      const free = card.dataset.free === 'true';

      const matchCat = activeCat === 'all' || activeCat === 'free'
        ? (activeCat === 'free' ? free : true)
        : cat === activeCat;
      const matchRegion = activeRegion === 'all' || region === activeRegion;

      if (matchCat && matchRegion) {
        card.hidden = false;
        visible++;
      } else {
        card.hidden = true;
      }
    });

    liveCount.textContent = visible;
    emptyMsg.style.display = visible === 0 ? 'block' : 'none';
  }

  document.querySelectorAll('.pill').forEach(pill => {
    pill.addEventListener('click', () => {
      const filter = pill.dataset.filter;
      const value = pill.dataset.value;

      document.querySelectorAll(`.pill[data-filter="${filter}"]`).forEach(p => p.classList.remove('active'));
      pill.classList.add('active');

      if (filter === 'cat') activeCat = value;
      if (filter === 'region') activeRegion = value;

      applyFilters();
    });
  });
</script>
</body>
</html>
