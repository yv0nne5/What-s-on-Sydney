name: Monthly Scrape — National Parks NSW

on:
  schedule:
    # 1st of every month at 8pm UTC = 2nd at 7am Sydney time
    - cron: "0 20 1 * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run monthly scrape
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py monthly

      - name: Commit updated site
        run: |
          git config user.name  "Whats-on-Sydney Bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html events.db
          git diff --staged --quiet || git commit -m "chore: monthly update [skip ci]"
          git push
